<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Stock Data Visualizer</title>
    <script>
    document.addEventListener("DOMContentLoaded", function() {
        function updateTimeFields() {
        const intraday = document.getElementById("time").value === "intra";
        ["start", "end"].forEach(id => { document.getElementById(id).required = !intraday; });
        document.querySelector("select#interval").required = intraday;
        document.getElementById("dates").style.display = intraday ? "none" : "block";
        document.getElementById("interval-group").style.display = intraday ? "block" : "none";
    }
    document.getElementById("time").addEventListener("change", updateTimeFields);
    updateTimeFields();
        document.querySelector("form").addEventListener("submit", function(event) {
        let time= document.getElementById("time").value;
        let symbol = document.getElementById("symbol").value;
        let chartType = document.getElementById("chart_type").value;
        let start = document.getElementById("start").value;
        let end = document.getElementById("end").value;
        let interval = document.getElementById("interval").value;
        if (symbol === "def") {
            alert("Please select a symbol.");
            event.preventDefault(); 
        } else if (chartType === "def") {
            alert("Please select a chart type.");
            event.preventDefault(); 
        } else if (time === "def") {
            alert("Please select a time series.");
            event.preventDefault(); 
        } else if (time === "intra" && !interval) {
            alert("Please select an interval for Intraday.");
            event.preventDefault(); 
        } else if (time !== "intra" && (!start || !end)) {
            alert("Please select both Start and End dates.");
            event.preventDefault();  
        } else if (start && end && new Date(start) > new Date(end)) {
            alert("Start date cannot be later than End date.");
            event.preventDefault(); 
        }
    });
});
    </script>
    <style>
        body {
            background-color: rgb(212, 227, 232);
        }

        h1 {
            text-align: center;
        }
        form {
            background-color: lightgray;
        }
        label {
            padding: 10px;
        }

        body { max-width: 1100px; margin: 40px auto; padding: 0 24px; font-family: system-ui, sans-serif; color: #193449; background: #f3f6f8; }
        .intro { text-align: center; color: #526675; }
        form { padding: 28px; border-radius: 16px; background: white; box-shadow: 0 8px 32px #18334812; }
        select, input, button { padding: 9px 12px; border: 1px solid #c3d0d8; border-radius: 6px; font: inherit; }
        button { background: #176b75; color: white; cursor: pointer; }
        .notice { padding: 16px; border-left: 4px solid #ae6424; background: #fff1df; }
        #chart_cont { margin-top: 24px; }
    </style>
</head>
<body>
    <h1>Stock Data Visualizer</h1>
    <p class="intro">Explore open, high, low and closing prices across time.</p>
    {% for message in get_flashed_messages() %}<p class="notice" role="alert">{{ message }}</p>{% endfor %}
    <form method="post">
        <label for="symbol">Choose Symbol</label>
        <select id="symbol" name="symbol" required>
            <option value="def" disabled selected>Select a Symbol</option> 
            {% for symbol in symbols %}
                <option value="{{ symbol }}">{{ symbol }}</option>
            {% endfor %}
        </select><br><br>

        <label for="chart_type">Choose Chart Type</label>
        <select id="chart_type" name="chart_type" required>
            <option value="def" disabled selected>Select a Chart Type</option> 
            <option value="bar">Bar</option>
            <option value="line">Line</option>
        </select><br><br>

        <label for="time">Choose Time Series</label>
        <select id="time" name="time" required>
            <option value="def" disabled selected>Select a Time Series </option> 
            <option value="intra">Intraday</option>
            <option value="daily">Daily</option>
            <option value="weekly">Weekly</option>
            <option value="monthly">Monthly</option>
        </select><br><br>
        <div id="dates">
            <label for="start">Start Date</label>
            <input type="date" id="start" name="start" required><br><br>
            <label for="end">End Date</label>
            <input type="date" id="end" name="end" required><br><br>
        </div>
        <div id="interval-group">
            <label for="interval">Choose Interval</label>
            <select id="interval" name="interval" required>
                <option value="1">1min</option>
                <option value="5">5</option>
                <option value="15">15</option>
                <option value="30">30</option>
                <option value="60">60</option>
            </select><br><br>
        </div>
        <button type="submit">Submit</button>
    </form>

    {% if chart_svg %}
    <div id="chart_cont">
        {{chart_svg | safe}}
    </div>
    {% endif %}
</body>
</html>
